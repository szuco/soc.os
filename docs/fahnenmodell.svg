<text x="468.661417" y="154.960630" font-size="10.582677" fill="#000">12 Loetpads 0,7-Raster in y — Pin 1 OBEN (y = −3,55)</text>
<line x1="445.114961" y1="136.062992" x2="445.114961" y2="211.653543" stroke="#000" stroke-width="0.944882" stroke-dasharray="4.535433 4.535433"/>
<text x="468.661417" y="171.968504" font-size="10.582677" fill="#000">gestrichelt: RECHTE Panelkante (x = 17,77) —</text>
<text x="468.661417" y="187.086614" font-size="10.582677" fill="#000">Fahne hier anlegen und nach links falten</text>
<text x="37.795276" y="294.803150" font-size="12.850394" fill="#000" font-weight="bold">ABLAUF</text>
<text x="37.795276" y="313.700787" font-size="10.960630" fill="#000">1. Teil 1 an die echte Fahne halten: Goldfinger-Seite und Pin-1-Kante uebertragen.</text>
<text x="37.795276" y="330.708661" font-size="10.960630" fill="#000">2. An der Faltlinie um 180° falten (wie ab Werk).</text>
<text x="37.795276" y="347.716535" font-size="10.960630" fill="#000">3. Teil 1 auf Teil 2 legen: Faltlinie auf die RECHTE Panelkante, Fahne zeigt nach links.</text>
<text x="37.795276" y="364.724409" font-size="10.960630" fill="#000">4. KONTROLLE 1: Die Goldfinger muessen NACH UNTEN auf die Pads zeigen (face-down).</text>
<text x="37.795276" y="381.732283" font-size="10.960630" fill="#000">5. KONTROLLE 2: Pin 1 der Fahne muss auf dem OBERSTEN Pad ankommen (y = -3,55).</text>
<text x="37.795276" y="398.740157" font-size="10.960630" fill="#000">6. KONTROLLE 3: Die Kontaktzone (2,0 lang) muss die Pads (x 4,45..7,65) ueberdecken -</text>
<text x="37.795276" y="415.748032" font-size="10.960630" fill="#000">   Fahnenlaenge 12,96 +-0,3 ab Panelkante.</text>
<text x="37.795276" y="453.543307" font-size="10.960630" fill="#000" font-weight="bold">Rechnung sagt: alles passt - dieses Blatt ist die Bestaetigung am ersten Muster.</text>
</svg>