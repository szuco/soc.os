<text x="498.897638" y="160.629921" font-size="10.582677" fill="#000">12 Loetpads 0,7-Raster (Pin 1 rechts)</text>
<line x1="377.952756" y1="201.448819" x2="491.338583" y2="201.448819" stroke="#000" stroke-width="0.944882" stroke-dasharray="4.535433 4.535433"/>
<text x="498.897638" y="204.094488" font-size="10.582677" fill="#000">Panelunterkante — Fahne hier anlegen und falten</text>
<text x="37.795276" y="294.803150" font-size="12.850394" fill="#000" font-weight="bold">ABLAUF</text>
<text x="37.795276" y="313.700787" font-size="10.960630" fill="#000">1. Teil 1 an die echte Fahne halten: Goldfinger-Seite und Pin-1-Kante uebertragen.</text>
<text x="37.795276" y="330.708661" font-size="10.960630" fill="#000">2. An der Faltlinie um 180° falten (wie ab Werk).</text>
<text x="37.795276" y="347.716535" font-size="10.960630" fill="#000">3. Teil 1 auf Teil 2 legen: Faltlinie auf die Panelunterkante.</text>
<text x="37.795276" y="364.724409" font-size="10.960630" fill="#000">4. KONTROLLE 1: Die Goldfinger muessen NACH UNTEN auf die Pads zeigen (face-down).</text>
<text x="37.795276" y="381.732283" font-size="10.960630" fill="#000">5. KONTROLLE 2: Pin 1 der Fahne muss auf dem RECHTEN Pad ankommen.</text>
<text x="37.795276" y="398.740157" font-size="10.960630" fill="#000">6. KONTROLLE 3: Die Kontaktzone (2,0 lang) muss die Pads (y 2,0..5,2) ueberdecken -</text>
<text x="37.795276" y="415.748032" font-size="10.960630" fill="#000">   Fahnenlaenge 12,96 +-0,3 ab Panelkante.</text>
<text x="37.795276" y="453.543307" font-size="10.960630" fill="#000" font-weight="bold">Rechnung sagt: alles passt - dieses Blatt ist die Bestaetigung am ersten Muster.</text>
</svg>