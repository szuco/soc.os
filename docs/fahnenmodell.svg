<text x="92.220472" y="189.959055" font-size="10.582677" fill="#000">auf welcher Seite die Goldfinger liegen —</text>
<text x="92.220472" y="204.321260" font-size="10.582677" fill="#000">diese Seite der Schablone ankreuzen und beschriften</text>
<text x="34.015748" y="219.061417" font-size="10.582677" fill="#000">Pin-1-Kante am echten Panel ablesen:</text>
<text x="34.015748" y="234.179528" font-size="10.582677" fill="#000">[ ] links   [ ] rechts   (auf der Schablone markieren)</text>
