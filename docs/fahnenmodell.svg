<text x="37.795276" y="37.795276" font-size="15.874016" fill="#000" font-weight="bold">Fahnenmodell ER-TFT1.69-3 — 1:1 drucken (100 %, keine Anpassung)</text>
<text x="37.795276" y="60.472441" font-size="11.338583" fill="#000">Kontrolle: dieses Lineal muss exakt 50 mm messen</text>
