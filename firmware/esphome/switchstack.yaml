# =============================================================================
# KiCad SwitchStack - ESPHome-Konfiguration
# =============================================================================
# Zielhardware : ESP32-S3-WROOM-1-N16R8
# Display      : 1,69" LCD rechteckig, ST7789, 240x280, quer eingebaut
# Front        : Busch-Jaeger Zentralscheibe 6435-914 (balance SI) im Rahmen
#                1721-914. Ihr Fenster misst 32,70 x 27,00 mm - die aktive
#                Flaeche des Panels ist 32,63 x 27,97 und fuellt es aus.
# Bedienung    : VIER Ecktaster unter den Druckkreuzen der Scheibe. Die
#                Symbole stehen auf den Achsen, die Kraft kommt an den Ecken
#                an - jede Richtung ist ein PAAR. Aufloesung siehe unten.
#
# NICHT mit `esphome config` geprueft: Auf dem Rechner, auf dem der
# Displaywechsel entstand, war ESPHome nicht installiert. Vor dem ersten Flash
# validieren; besonders die Offsets des 240x280-Panels.
#
# Die Praesenz-Dunkeltastung unten (VL53L1X, kein Radar mehr) ist beim LCD
# reiner Komfort und Stromsparen, keine Schutzmassnahme (kein Einbrennen).
#
# STAND: Die Jalousien laufen hier als template-Cover auf ZEIT. Die
# stromabhaengige Lasterkennung braucht PWM-synchrones ADC-Sampling und ist in
# reinem YAML nicht umsetzbar - siehe docs/09-display-and-mcu.md, Abschnitt 4.
# Sie zieht in eine eigene C++-External-Component um.
#
# Der Hardware-Hard-Trip (Comparator + Latch) wirkt unabhaengig von dieser
# Konfiguration und bleibt der eigentliche Schutz.
# =============================================================================

substitutions:
  name: switchstack
  friendly_name: SwitchStack

  # --- Fahrzeiten (Sekunden) --------------------------------------------------
  # Fahrzeit real 18 s (Datenblatt) + Reserve, siehe docs/11-motor-data.md
  travel_time: "30s"
  # Mechanische Stopzeit vor Umpolung
  reversal_pause: "300ms"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Beim Start alles stromlos: beide Brueckenzweige low = Motor aus.
  on_boot:
    priority: 600
    then:
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  # ESP32-S3 hat nativen USB - kein separater USB-UART-Baustein noetig.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# WLAN ist ausdruecklich sekundaer. In einer massiven Unterputzdose hinter einer
# Frontplatte ist der Empfang schwach - RS-485 ist der primaere Weg.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

captive_portal:

# -----------------------------------------------------------------------------
# Busse
# -----------------------------------------------------------------------------

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  id: bus_i2c

# Der ST7789 ist 4-Draht-SPI, kein QSPI. Die Netznamen am Stack heissen
# weiterhin QSPI_*, weil sie durch alle drei Boards laufen und eine
# Umbenennung den Bottom-Schaltplan aendern wuerde (dessen Layout ist geroutet).
# Belegung: QSPI_CLK = SCK, QSPI_D0 = MOSI, QSPI_D1 = DC.
spi:
  id: bus_disp
  clk_pin: GPIO12
  mosi_pin: GPIO11

# RS-485: primaere Kommunikation. DE/RE ueber flow_control_pin.
uart:
  - id: uart_rs485
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 19200
  # Reserve-UART auf J7 des Top-Boards (unbestueckt). Hiess bis Stack-Pinout
  # v0.4 uart_radar - der Radar ist durch den VL53L1X ersetzt.
  - id: uart_aux
    tx_pin: GPIO42
    rx_pin: GPIO41
    baud_rate: 115200

# GPIO-Expander fuer die langsamen Signale - entlastet das knappe Pinbudget.
# PCF8575 (16 Bit) statt PCF8574: Mit vier Reed-Kontakten - Verschluss UND
# Sabotage je Fenster - reichen acht Portpins nicht mehr. Gleiche Adresse,
# gleicher Treiber, ein Bauteil statt zwei.
pcf8574:
  - id: expander
    address: 0x20
    pcf8575: true

# -----------------------------------------------------------------------------
# Ausgaenge
# -----------------------------------------------------------------------------

output:
  - platform: ledc
    id: disp_backlight
    pin: GPIO43
    frequency: 2000Hz

  # Je Brueckenzweig ein PWM-faehiger Ausgang (INA/INB) - die Richtung
  # entsteht daraus, welcher Zweig moduliert. Pins == Mid-Schaltplan.
  - platform: ledc
    id: m1_ina
    pin: GPIO38
    frequency: 20000Hz     # oberhalb des Hoerbereichs
  - platform: ledc
    id: m1_inb
    pin: GPIO39
    frequency: 20000Hz
  - platform: ledc
    id: m2_ina
    pin: GPIO40
    frequency: 20000Hz
  - platform: ledc
    id: m2_inb
    pin: GPIO47
    frequency: 20000Hz

  - platform: ledc
    id: buzzer_out
    pin: GPIO15

# GPIO48 ist RS485_DIR (DE + /RE des MAX3485) - wird erst mit der
# Modbus-/RS485-Komponente belegt.

switch:
  - platform: gpio
    name: Weihnachtsstern
    id: stern
    icon: mdi:star-four-points
    pin:
      pcf8574: expander
      number: 3
      mode:
        output: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: trip_reset
    pin:
      pcf8574: expander
      number: 2
      mode:
        output: true
    restore_mode: ALWAYS_OFF

  # Meldekontakt zur Dunstabzugshaube (PhotoMOS, potentialfrei, NUR SELV).
  # Der PCF8574 senkt kraeftig und sourct kaum, die LED haengt deshalb an
  # 3,3 V und wird gegen Masse gezogen: LOW = Kontakt geschlossen.
  - platform: gpio
    id: haube_kontakt
    pin:
      pcf8574: expander
      number: 5
      mode:
        output: true
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF

# Der ST7789 ist ein LCD - die Helligkeit kommt aus der Hintergrundbeleuchtung,
# nicht aus einem Displaykommando. GPIO43 ist frei, weil das Logging ueber
# den nativen USB des ESP32-S3 laeuft und UART0 damit unbenutzt bleibt.
light:
  - platform: monochromatic
    name: Displayhelligkeit
    output: disp_backlight
    id: backlight
    default_transition_length: 400ms
    restore_mode: RESTORE_DEFAULT_ON

rtttl:
  output: buzzer_out
  id: alarmton

# -----------------------------------------------------------------------------
# Einstellbare Werte - alles, was am realen Fenster nachgezogen werden muss
# -----------------------------------------------------------------------------
# Fahrzeit und Stromskalierung gehoeren an die Anlage angepasst, nicht in den
# Quelltext. Alle Werte ueberleben einen Neustart (restore_value) und sind in
# Home Assistant direkt einstellbar.
number:
  - platform: template
    name: Fahrzeit 1 Auf
    id: t_auf_1
    unit_of_measurement: s
    min_value: 5
    max_value: 60
    step: 0.5
    initial_value: 18
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: Fahrzeit 1 Zu
    id: t_zu_1
    unit_of_measurement: s
    min_value: 5
    max_value: 60
    step: 0.5
    initial_value: 18
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: Fahrzeit 2 Auf
    id: t_auf_2
    unit_of_measurement: s
    min_value: 5
    max_value: 60
    step: 0.5
    initial_value: 18
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: Fahrzeit 2 Zu
    id: t_zu_2
    unit_of_measurement: s
    min_value: 5
    max_value: 60
    step: 0.5
    initial_value: 18
    restore_value: true
    optimistic: true
    entity_category: config

  # Sanftauslauf: ab wieviel Prozent der Fahrzeit auf welche PWM gerampt wird.
  - platform: template
    name: Sanftauslauf ab
    id: sanft_ab
    unit_of_measurement: '%'
    min_value: 50
    max_value: 95
    step: 5
    initial_value: 80
    restore_value: true
    optimistic: true
    entity_category: config
  - platform: template
    name: Sanftauslauf PWM
    id: sanft_pwm
    unit_of_measurement: '%'
    min_value: 20
    max_value: 100
    step: 5
    initial_value: 40
    restore_value: true
    optimistic: true
    entity_category: config

  # Versatz zwischen den beiden Fluegeln. Zweifluegelige Klapplaeden
  # UEBERLAPPEN im geschlossenen Zustand - der ueberdeckende Fluegel muss
  # zuletzt schliessen und zuerst oeffnen, sonst schlagen sie aufeinander.
  # Der Original-Controller K0000230 macht es mit 6 s.
  - platform: template
    name: Fluegelversatz
    id: versatz
    unit_of_measurement: s
    min_value: 0
    max_value: 20
    step: 0.5
    initial_value: 6
    restore_value: true
    optimistic: true
    entity_category: config

  # Skalierung der Strommessung: 1 / (R_shunt * Verstaerkung). Rechnerisch
  # 1/(0,001 * 50) = 20 A/V, aber erst die Messung am realen Aufbau sagt,
  # was der interne ADC daraus macht. Deshalb einstellbar statt fest.
  - platform: template
    name: Stromskalierung
    id: strom_faktor
    unit_of_measurement: A/V
    min_value: 1
    max_value: 50
    step: 0.1
    initial_value: 20
    restore_value: true
    optimistic: true
    entity_category: config

# Welcher Fluegel ueberdeckt den anderen - zur LAUFZEIT umstellbar, weil es
# vom Fenster abhaengt und nicht vom Geraet.
select:
  - platform: template
    name: Ueberdeckender Fluegel
    id: ueberdeckung
    options: ["Jalousie 1", "Jalousie 2"]
    initial_option: "Jalousie 2"
    optimistic: true
    restore_value: true
    entity_category: config

# -----------------------------------------------------------------------------
# Fahrskripte: Versatz - Anlauf - Fahrt - Sanftauslauf - aus
# -----------------------------------------------------------------------------
# time_based-Cover koennen ihre Dauer nur zur Compilezeit lesen. Damit die
# Fahrzeit im Betrieb einstellbar bleibt, faehrt jede Bewegung als Skript mit
# Lambda-Verzoegerungen. mode: restart heisst: ein neuer Befehl bricht den
# laufenden ab, ohne dass ein Zweig haengenbleibt.
#
# ACHTUNG, das ist NICHT die Lasterkennung. Der Sanftauslauf laeuft hier auf
# Zeit; erst die C++-Komponente kann ihn am Stromverlauf festmachen.
script:
  - id: fahrt1_auf
    mode: restart
    then:
      # beim Oeffnen wartet der VERDECKTE.
      - delay: !lambda |-
          return id(ueberdeckung).state == "Jalousie 2"
                 ? (uint32_t)(id(versatz).state * 1000.0) : 0;
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}
      - delay: ${reversal_pause}
      - output.set_level: {id: m1_ina, level: 100%}
      - delay: !lambda 'return (uint32_t)(id(t_auf_1).state * 10.0 * id(sanft_ab).state);'
      - output.set_level:
          id: m1_ina
          level: !lambda 'return id(sanft_pwm).state / 100.0;'
      - delay: !lambda 'return (uint32_t)(id(t_auf_1).state * 400.0);'
      - output.set_level: {id: m1_ina, level: 0%}
  - id: fahrt1_zu
    mode: restart
    then:
      # beim Schliessen wartet der UEBERDECKENDE.
      - delay: !lambda |-
          return id(ueberdeckung).state == "Jalousie 1"
                 ? (uint32_t)(id(versatz).state * 1000.0) : 0;
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}
      - delay: ${reversal_pause}
      - output.set_level: {id: m1_inb, level: 100%}
      - delay: !lambda 'return (uint32_t)(id(t_zu_1).state * 10.0 * id(sanft_ab).state);'
      - output.set_level:
          id: m1_inb
          level: !lambda 'return id(sanft_pwm).state / 100.0;'
      - delay: !lambda 'return (uint32_t)(id(t_zu_1).state * 400.0);'
      - output.set_level: {id: m1_inb, level: 0%}
  - id: fahrt2_auf
    mode: restart
    then:
      # beim Oeffnen wartet der VERDECKTE.
      - delay: !lambda |-
          return id(ueberdeckung).state == "Jalousie 1"
                 ? (uint32_t)(id(versatz).state * 1000.0) : 0;
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}
      - delay: ${reversal_pause}
      - output.set_level: {id: m2_ina, level: 100%}
      - delay: !lambda 'return (uint32_t)(id(t_auf_2).state * 10.0 * id(sanft_ab).state);'
      - output.set_level:
          id: m2_ina
          level: !lambda 'return id(sanft_pwm).state / 100.0;'
      - delay: !lambda 'return (uint32_t)(id(t_auf_2).state * 400.0);'
      - output.set_level: {id: m2_ina, level: 0%}
  - id: fahrt2_zu
    mode: restart
    then:
      # beim Schliessen wartet der UEBERDECKENDE.
      - delay: !lambda |-
          return id(ueberdeckung).state == "Jalousie 2"
                 ? (uint32_t)(id(versatz).state * 1000.0) : 0;
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}
      - delay: ${reversal_pause}
      - output.set_level: {id: m2_inb, level: 100%}
      - delay: !lambda 'return (uint32_t)(id(t_zu_2).state * 10.0 * id(sanft_ab).state);'
      - output.set_level:
          id: m2_inb
          level: !lambda 'return id(sanft_pwm).state / 100.0;'
      - delay: !lambda 'return (uint32_t)(id(t_zu_2).state * 400.0);'
      - output.set_level: {id: m2_inb, level: 0%}
  - id: halt_alle
    then:
      - script.stop: fahrt1_auf
      - script.stop: fahrt1_zu
      - script.stop: fahrt2_auf
      - script.stop: fahrt2_zu
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}


# -----------------------------------------------------------------------------
# Bedienmenue
# -----------------------------------------------------------------------------
# ESPHome bringt das Menue mit: graphical_display_menu kann Untermenues,
# Zahlenwerte, Schalter und Kommandos und wird ueber display_menu.up/down/
# enter/left bedient. Genau darauf passen die vier Bedienrichtungen der
# Zentralscheibe. Damit ist Punkt 37 ohne eigene Zustandsmaschine erledigt.
#
# Wichtig fuer die Praxis: Die Fahrzeiten stehen HIER im Menue - man kann sie
# also am Fenster einstellen, ohne Home Assistant und ohne Flash.
graphical_display_menu:
  id: hauptmenu
  display: panel
  font: font_mid
  active: false
  mode: rotary
  items:
    - type: menu
      text: Jalousie 1
      items:
        - type: command
          text: Auf
          on_value:
            then: [script.execute: fahrt1_auf]
        - type: command
          text: Zu
          on_value:
            then: [script.execute: fahrt1_zu]
        - type: number
          text: Fahrzeit Auf
          number: t_auf_1
          format: "%.1f"
        - type: number
          text: Fahrzeit Zu
          number: t_zu_1
          format: "%.1f"
    - type: menu
      text: Jalousie 2
      items:
        - type: command
          text: Auf
          on_value:
            then: [script.execute: fahrt2_auf]
        - type: command
          text: Zu
          on_value:
            then: [script.execute: fahrt2_zu]
        - type: number
          text: Fahrzeit Auf
          number: t_auf_2
          format: "%.1f"
        - type: number
          text: Fahrzeit Zu
          number: t_zu_2
          format: "%.1f"
    - type: menu
      text: Sanftauslauf
      items:
        - type: number
          text: Ab
          number: sanft_ab
          format: "%.0f"
        - type: number
          text: PWM
          number: sanft_pwm
          format: "%.0f"
    - type: switch
      text: Weihnachtsstern
      switch: stern
      on_text: an
      off_text: aus
    - type: switch
      text: Dunstabzugshaube
      switch: haube_kontakt
      on_text: an
      off_text: aus
    - type: menu
      text: Fluegelversatz
      items:
        - type: select
          text: Ueberdeckend
          select: ueberdeckung
        - type: number
          text: Versatz
          number: versatz
          format: "%.1f"
    - type: menu
      text: Messwerte
      items:
        - type: label
          text: !lambda 'return "Strom 1: " + to_string((int)(id(i_sense1).state * 100) / 100.0) + " A";'
        - type: label
          text: !lambda 'return "Strom 2: " + to_string((int)(id(i_sense2).state * 100) / 100.0) + " A";'
        - type: number
          text: Skalierung
          number: strom_faktor
          format: "%.1f"
    - type: command
      text: Alles stoppen
      on_value:
        then: [script.execute: halt_alle]
    - type: back
      text: Zurueck

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------

# glyphs muss angegeben werden, sonst fehlen Umlaute und das Gradzeichen -
# ESPHome bettet nur die aufgezaehlten Zeichen ein.
.glyphs: &glyphs "!\"%()+=,-_.:*/°|'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
  abcdefghijklmnopqrstuvwxyzÄÖÜäöüß"

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 34
    glyphs: *glyphs
  - file: "gfonts://Roboto"
    id: font_mid
    size: 18
    glyphs: *glyphs
  - file: "gfonts://Roboto"
    id: font_small
    size: 13
    glyphs: *glyphs

# ST7789 ist in ESPHome nativ enthalten - die 214-Kommando-Initsequenz des
# ST77916 entfaellt ersatzlos. Das 240x280-Panel sitzt auf einem 240x320-
# Controller, deshalb der Zeilenversatz von 20; quer eingebaut ueber rotation.
# OFFSETS AM REALEN PANEL PRUEFEN - sie sind der haeufigste Fehler bei diesem
# Typ und zeigen sich als Streifen am Rand.
display:
  - platform: st7789v
    model: CUSTOM
    id: panel
    cs_pin: GPIO10
    dc_pin: GPIO13
    reset_pin: GPIO16
    width: 240
    height: 280
    offset_width: 0
    offset_height: 20
    rotation: 90
    auto_clear_enabled: false
    update_interval: 1s
    lambda: |-
      // Quer: 280 breit, 240 hoch. Mitte x = 140.
      // Solange das Menue offen ist, zeichnet es selbst - dann haelt sich der
      // Startbildschirm heraus.
      if (id(hauptmenu).is_active()) return;

      it.fill(Color::BLACK);

      // --- Raumklima, die grosse Zahl ---------------------------------
      if (id(raum_temp).has_state())
        it.printf(140, 8, id(font_big), TextAlign::TOP_CENTER,
                  "%.1f°C", id(raum_temp).state);
      if (id(raum_hum).has_state())
        it.printf(140, 50, id(font_mid), TextAlign::TOP_CENTER,
                  "%.0f %% rF", id(raum_hum).state);

      it.line(20, 82, 260, 82);

      // --- Fenster: Verschluss und Sabotage je Seite -------------------
      // Sabotage in Rot an fester Spalte - eine Farbe faellt im Vorbeigehen
      // auf, ein angehaengtes Wort nicht.
      auto rot = Color(255, 90, 90);
      it.printf(20, 92, id(font_small), TextAlign::TOP_LEFT, "Fenster 1: %s",
                id(fenster1).state ? "offen" : "zu");
      it.printf(20, 112, id(font_small), TextAlign::TOP_LEFT, "Fenster 2: %s",
                id(fenster2).state ? "offen" : "zu");
      if (id(sabotage1).state)
        it.print(150, 92, id(font_small), rot, TextAlign::TOP_LEFT, "SABOTAGE");
      if (id(sabotage2).state)
        it.print(150, 112, id(font_small), rot, TextAlign::TOP_LEFT, "SABOTAGE");

      // --- Motorstroeme, nur wenn nennenswert --------------------------
      if (id(i_sense1).has_state() && id(i_sense1).state > 0.05f)
        it.printf(20, 138, id(font_small), TextAlign::TOP_LEFT,
                  "Motor 1: %.2f A", id(i_sense1).state);
      if (id(i_sense2).has_state() && id(i_sense2).state > 0.05f)
        it.printf(20, 158, id(font_small), TextAlign::TOP_LEFT,
                  "Motor 2: %.2f A", id(i_sense2).state);

      // --- Fusszeile: Praesenz und Stern ------------------------------
      it.printf(20, 216, id(font_small), TextAlign::BASELINE_LEFT, "%s",
                id(bewegung).state ? "anwesend" : "");
      it.printf(260, 216, id(font_small), TextAlign::BASELINE_RIGHT, "%s",
                id(stern).state ? "Stern an" : "");

# -----------------------------------------------------------------------------
# Sensorik
# -----------------------------------------------------------------------------

sensor:
  - platform: sht4x
    address: 0x44
    temperature:
      name: Temperatur
      id: raum_temp
    humidity:
      name: Luftfeuchte
      id: raum_hum
    update_interval: 30s

  # Strommessung. ACHTUNG: Diese Werte sind PWM-gemittelt und NICHT
  # PWM-synchron abgetastet. Sie taugen zur Anzeige und zur groben
  # Plausibilitaet, NICHT als Stall-Erkennung. Siehe docs/09, Abschnitt 4.
  - platform: adc
    pin: GPIO1
    name: Strom Motor 1
    id: i_sense1
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: A
    accuracy_decimals: 2
    filters:
      - lambda: return x * id(strom_faktor).state;
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: adc
    pin: GPIO2
    name: Strom Motor 2
    id: i_sense2
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: A
    accuracy_decimals: 2
    filters:
      - lambda: return x * id(strom_faktor).state;
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

binary_sensor:
  # --- Vier Ecktaster ---------------------------------------------------
  # Sie sitzen unter den Druckkreuzen der Zentralscheibe bei (+/-18 / +/-20).
  # Einzeln haben sie KEINE Bedeutung - sie sind nur die Rohsignale.
  - platform: gpio
    id: ecke_or
    internal: true
    pin: {number: GPIO4, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms, delayed_off: 20ms]
  - platform: gpio
    id: ecke_ol
    internal: true
    pin: {number: GPIO5, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms, delayed_off: 20ms]
  - platform: gpio
    id: ecke_ul
    internal: true
    pin: {number: GPIO6, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms, delayed_off: 20ms]
  - platform: gpio
    id: ecke_ur
    internal: true
    pin: {number: GPIO7, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms, delayed_off: 20ms]

  # --- Daraus die vier Bedienrichtungen ---------------------------------
  # Die starre Scheibe kippt beim Druck auf ein Symbol; die beiden
  # benachbarten Eckkreuze gehen mit. Jede Richtung ist damit ein Paar, und
  # jedes Paar ist eindeutig. Die 30 ms Verzoegerung fangen ab, dass die
  # beiden Taster eines Paares nie exakt gleichzeitig schliessen.
  #
  # Die Zuordnung Richtung -> Aktion ist VORLAEUFIG. Verbindlich wird sie
  # erst mit der Menue-Zustandsmaschine, Punkt 37.
  # Jede Taste hat zwei Bedeutungen: im Menue navigiert sie, sonst fährt sie.
  # OK oeffnet das Menue, wenn keines offen ist - das ist der einzige Weg
  # hinein, und die Scheibe beschriftet ihn passend.
  - platform: template
    name: Taste Hoch
    id: taste_hoch
    lambda: 'return id(ecke_ol).state && id(ecke_or).state;'
    filters: [delayed_on: 30ms]
    on_press:
      then:
        - if:
            condition: {lambda: 'return id(hauptmenu).is_active();'}
            then: [display_menu.up: hauptmenu]
            else: [cover.open: jalousie1, cover.open: jalousie2]
  - platform: template
    name: Taste Runter
    id: taste_runter
    lambda: 'return id(ecke_ul).state && id(ecke_ur).state;'
    filters: [delayed_on: 30ms]
    on_press:
      then:
        - if:
            condition: {lambda: 'return id(hauptmenu).is_active();'}
            then: [display_menu.down: hauptmenu]
            else: [cover.close: jalousie1, cover.close: jalousie2]
  - platform: template
    name: Taste OK
    id: taste_ok
    lambda: 'return id(ecke_or).state && id(ecke_ur).state;'
    filters: [delayed_on: 30ms]
    on_press:
      then:
        - if:
            condition: {lambda: 'return id(hauptmenu).is_active();'}
            then: [display_menu.enter: hauptmenu]
            else: [display_menu.show: hauptmenu]
  - platform: template
    name: Taste Play
    id: taste_play
    lambda: 'return id(ecke_ol).state && id(ecke_ul).state;'
    filters: [delayed_on: 30ms]
    on_press:
      then:
        # Im Menue: eine Ebene zurueck. Ausserhalb: alles anhalten - die
        # naheliegendste Funktion fuer eine Taste, die man im Dunkeln trifft.
        - if:
            condition: {lambda: 'return id(hauptmenu).is_active();'}
            then: [display_menu.left: hauptmenu]
            else: [script.execute: halt_alle]

  # Praesenz vor dem Display. Der VL53L1X sitzt auf dem Top-Board und schaut
  # durch das Fenster im oberen Steg der Frontplatte. Der Interrupt GPIO1
  # liegt auf PRESENCE_INT und damit auf Expanderpin 4 - die Schwelle stellt
  # der Sensor selbst, ESPHome liest nur das Ergebnis.
  #
  # OFFEN: Der Distanzwert selbst braucht eine External Component
  # (esphome hat nur vl53l0x nativ). Erst damit lassen sich die zwei
  # Funktionen trennen - unter 0,6 m Display wecken, Baseline minus 15 cm
  # Durchstieg melden. Siehe docs/09.
  - platform: gpio
    name: Praesenz
    id: bewegung
    device_class: occupancy
    pin:
      pcf8574: expander
      number: 4
      mode:
        input: true
    on_press:
      then:
        - light.turn_on:
            id: backlight
            brightness: 80%
    on_release:
      then:
        - delay: 120s
        - if:
            condition:
              binary_sensor.is_off: bewegung
            then:
              - light.turn_off: backlight

  # Hardware-Ueberstromabschaltung, latched. Nur lesbar - der Schutz wirkt
  # in Hardware, diese Entitaeten melden ihn lediglich nach Home Assistant.
  - platform: gpio
    name: Hard-Trip Motor 1
    device_class: problem
    pin: {pcf8574: expander, number: 0, mode: {input: true}}
  - platform: gpio
    name: Hard-Trip Motor 2
    device_class: problem
    pin: {pcf8574: expander, number: 1, mode: {input: true}}

  # Feldkontakte. Reed schliesst gegen Masse, der externe 10k-Pullup zieht
  # den Eingang sonst hoch - geschlossenes Fenster ist also LOW, deshalb
  # inverted. 300 ms Entprellung zusaetzlich zum RC-Glied auf dem Board.
  #
  # Je Fenster ZWEI Kontakte: Verschluss (P6/P7) und Sabotage (P10/P11, in
  # ESPHome die Nummern 8 und 9). Mit den Endlagen der Klapplaeden hat keiner
  # von beiden etwas zu tun - die kommen aus Fahrzeit und Strom.
  - platform: gpio
    name: Fenster 1
    id: fenster1
    device_class: window
    pin: {pcf8574: expander, number: 6, mode: {input: true}, inverted: true}
    filters: [delayed_on_off: 300ms]
  - platform: gpio
    name: Fenster 2
    id: fenster2
    device_class: window
    pin: {pcf8574: expander, number: 7, mode: {input: true}, inverted: true}
    filters: [delayed_on_off: 300ms]
  - platform: gpio
    name: Sabotage Fenster 1
    id: sabotage1
    device_class: tamper
    pin: {pcf8574: expander, number: 8, mode: {input: true}, inverted: true}
    filters: [delayed_on_off: 300ms]
  - platform: gpio
    name: Sabotage Fenster 2
    id: sabotage2
    device_class: tamper
    pin: {pcf8574: expander, number: 9, mode: {input: true}, inverted: true}
    filters: [delayed_on_off: 300ms]

# -----------------------------------------------------------------------------
# Jalousien
# -----------------------------------------------------------------------------
# Zeitgesteuert. Jede Fahrt endet spaetestens nach ${travel_time}.
# Richtungswechsel immer ueber Stop mit ${reversal_pause} Pause.

cover:
  # Template statt time_based: Die Fahrzeit soll im Betrieb einstellbar sein
  # (siehe number oben), und time_based liest seine Dauer nur zur Compilezeit.
  # optimistic/assumed_state, weil es keine Positionsrueckmeldung gibt - die
  # Reed-Kontakte sichern das Fenster und sagen nichts ueber den Laden.
  - platform: template
    name: Jalousie 1
    id: jalousie1
    device_class: shutter
    optimistic: true
    assumed_state: true
    open_action:
      - script.execute: fahrt1_auf
    close_action:
      - script.execute: fahrt1_zu
    stop_action:
      - script.stop: fahrt1_auf
      - script.stop: fahrt1_zu
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}

  - platform: template
    name: Jalousie 2
    id: jalousie2
    device_class: shutter
    optimistic: true
    assumed_state: true
    open_action:
      - script.execute: fahrt2_auf
    close_action:
      - script.execute: fahrt2_zu
    stop_action:
      - script.stop: fahrt2_auf
      - script.stop: fahrt2_zu
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}


button:
  - platform: template
    name: Hard-Trip zuruecksetzen
    entity_category: config
    on_press:
      - switch.turn_on: trip_reset
      - delay: 50ms
      - switch.turn_off: trip_reset

  - platform: template
    name: Alarmton testen
    entity_category: diagnostic
    on_press:
      - rtttl.play: "alarm:d=4,o=5,b=140:8b,8p,8b,8p,8b"
