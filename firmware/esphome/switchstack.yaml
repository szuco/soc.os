# =============================================================================
# KiCad SwitchStack - ESPHome-Konfiguration
# =============================================================================
# Zielhardware : ESP32-S3-WROOM-1-N16R8
# Display      : 1,46" LCD rund, ST77916, 360x360, QSPI
# Bedienung    : 4 sichelfoermige Hardware-Tasten um das Display
#
# ST77916 hat keinen eingebauten mipi_spi-Treiber. Er laeuft ueber
# model: CUSTOM mit der Hersteller-Initialisierungssequenz in
# st77916_init.yaml - ohne jede C++-Komponente.
#
# Die Praesenz-Dunkeltastung unten (VL53L1X, kein Radar mehr) ist beim LCD
# reiner Komfort und Stromsparen, keine Schutzmassnahme (kein Einbrennen).
#
# STAND: Die Jalousien laufen hier als template-Cover auf ZEIT. Die
# stromabhaengige Lasterkennung braucht PWM-synchrones ADC-Sampling und ist in
# reinem YAML nicht umsetzbar - siehe docs/09-display-and-mcu.md, Abschnitt 4.
# Sie zieht in eine eigene C++-External-Component um.
#
# Der Hardware-Hard-Trip (Comparator + Latch) wirkt unabhaengig von dieser
# Konfiguration und bleibt der eigentliche Schutz.
# =============================================================================

substitutions:
  name: switchstack
  friendly_name: SwitchStack

  # --- Fahrzeiten (Sekunden) --------------------------------------------------
  # Fahrzeit real 18 s (Datenblatt) + Reserve, siehe docs/11-motor-data.md
  travel_time: "30s"
  # Mechanische Stopzeit vor Umpolung
  reversal_pause: "300ms"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Beim Start alles stromlos: beide Brueckenzweige low = Motor aus.
  on_boot:
    priority: 600
    then:
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  # ESP32-S3 hat nativen USB - kein separater USB-UART-Baustein noetig.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# WLAN ist ausdruecklich sekundaer. In einer massiven Unterputzdose hinter einer
# Frontplatte ist der Empfang schwach - RS-485 ist der primaere Weg.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback

captive_portal:

# -----------------------------------------------------------------------------
# Busse
# -----------------------------------------------------------------------------

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  id: bus_i2c

# QSPI fuer das AMOLED: Takt + 4 Datenleitungen
spi:
  id: bus_qspi
  type: quad
  clk_pin: GPIO12
  data_pins: [GPIO11, GPIO13, GPIO14, GPIO21]

# RS-485: primaere Kommunikation. DE/RE ueber flow_control_pin.
uart:
  - id: uart_rs485
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 19200
  # Reserve-UART auf J7 des Top-Boards (unbestueckt). Hiess bis Stack-Pinout
  # v0.4 uart_radar - der Radar ist durch den VL53L1X ersetzt.
  - id: uart_aux
    tx_pin: GPIO42
    rx_pin: GPIO41
    baud_rate: 115200

# GPIO-Expander fuer die langsamen Signale - entlastet das knappe Pinbudget.
pcf8574:
  - id: expander
    address: 0x20

# -----------------------------------------------------------------------------
# Ausgaenge
# -----------------------------------------------------------------------------

output:
  - platform: ledc
    id: disp_backlight
    pin: GPIO43
    frequency: 2000Hz

  # Je Brueckenzweig ein PWM-faehiger Ausgang (INA/INB) - die Richtung
  # entsteht daraus, welcher Zweig moduliert. Pins == Mid-Schaltplan.
  - platform: ledc
    id: m1_ina
    pin: GPIO38
    frequency: 20000Hz     # oberhalb des Hoerbereichs
  - platform: ledc
    id: m1_inb
    pin: GPIO39
    frequency: 20000Hz
  - platform: ledc
    id: m2_ina
    pin: GPIO40
    frequency: 20000Hz
  - platform: ledc
    id: m2_inb
    pin: GPIO47
    frequency: 20000Hz

  - platform: ledc
    id: buzzer_out
    pin: GPIO15

# GPIO48 ist RS485_DIR (DE + /RE des MAX3485) - wird erst mit der
# Modbus-/RS485-Komponente belegt.

switch:
  - platform: gpio
    name: Weihnachtsstern
    icon: mdi:star-four-points
    pin:
      pcf8574: expander
      number: 3
      mode:
        output: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: trip_reset
    pin:
      pcf8574: expander
      number: 2
      mode:
        output: true
    restore_mode: ALWAYS_OFF

  # Meldekontakt zur Dunstabzugshaube (PhotoMOS, potentialfrei, NUR SELV).
  # Der PCF8574 senkt kraeftig und sourct kaum, die LED haengt deshalb an
  # 3,3 V und wird gegen Masse gezogen: LOW = Kontakt geschlossen.
  - platform: gpio
    id: haube_kontakt
    pin:
      pcf8574: expander
      number: 5
      mode:
        output: true
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF

# ST77916 ist ein LCD - die Helligkeit kommt aus der Hintergrundbeleuchtung,
# nicht aus einem Displaykommando. GPIO43 ist frei, weil das Logging ueber
# den nativen USB des ESP32-S3 laeuft und UART0 damit unbenutzt bleibt.
light:
  - platform: monochromatic
    name: Displayhelligkeit
    output: disp_backlight
    id: backlight
    default_transition_length: 400ms
    restore_mode: RESTORE_DEFAULT_ON

rtttl:
  output: buzzer_out
  id: alarmton

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

# ST77916 hat KEINEN eingebauten mipi_spi-Treiber - wird ueber model: CUSTOM
# mit der Hersteller-Initialisierungssequenz gefahren. Kein C++ noetig.
display:
  - platform: mipi_spi
    model: CUSTOM
    id: panel
    bus_mode: quad
    cs_pin: GPIO10
    reset_pin: GPIO16
    dimensions:
      width: 360
      height: 360
    invert_colors: true
    pixel_mode: 16bit
    data_rate: 40MHz
    auto_clear_enabled: false
    update_interval: 1s
    init_sequence: !include st77916_init.yaml
    lambda: |-
      it.fill(Color::BLACK);
      if (id(raum_temp).has_state()) {
        it.printf(180, 140, id(font_big), TextAlign::CENTER,
                  "%.1f°C", id(raum_temp).state);
      }
      if (id(raum_hum).has_state()) {
        it.printf(180, 200, id(font_small), TextAlign::CENTER,
                  "%.0f %% rF", id(raum_hum).state);
      }
      it.printf(180, 262, id(font_small), TextAlign::CENTER,
                id(bewegung).state ? "anwesend" : "");

# -----------------------------------------------------------------------------
# Sensorik
# -----------------------------------------------------------------------------

sensor:
  - platform: sht4x
    address: 0x44
    temperature:
      name: Temperatur
      id: raum_temp
    humidity:
      name: Luftfeuchte
      id: raum_hum
    update_interval: 30s

  # Strommessung. ACHTUNG: Diese Werte sind PWM-gemittelt und NICHT
  # PWM-synchron abgetastet. Sie taugen zur Anzeige und zur groben
  # Plausibilitaet, NICHT als Stall-Erkennung. Siehe docs/09, Abschnitt 4.
  - platform: adc
    pin: GPIO1
    name: Strom Motor 1
    id: i_sense1
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: A
    accuracy_decimals: 2
    filters:
      - multiply: 5.0          # Platzhalter: 1/(Rshunt * Gain), nach Kalibrierung setzen
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: adc
    pin: GPIO2
    name: Strom Motor 2
    id: i_sense2
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: A
    accuracy_decimals: 2
    filters:
      - multiply: 5.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

binary_sensor:
  - platform: gpio
    id: btn1
    pin: {number: GPIO4, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms, delayed_off: 20ms]
    on_press:
      then: [cover.open: jalousie1]
  - platform: gpio
    id: btn2
    pin: {number: GPIO5, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms, delayed_off: 20ms]
    on_press:
      then: [cover.close: jalousie1]
  - platform: gpio
    id: btn3
    pin: {number: GPIO6, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms, delayed_off: 20ms]
    on_press:
      then: [cover.open: jalousie2]
  - platform: gpio
    id: btn4
    pin: {number: GPIO7, mode: {input: true, pullup: true}, inverted: true}
    filters: [delayed_on: 20ms, delayed_off: 20ms]
    on_press:
      then: [cover.close: jalousie2]

  # Praesenz vor dem Display. Der VL53L1X sitzt auf dem Top-Board und schaut
  # durch das Fenster im oberen Steg der Frontplatte. Der Interrupt GPIO1
  # liegt auf PRESENCE_INT und damit auf Expanderpin 4 - die Schwelle stellt
  # der Sensor selbst, ESPHome liest nur das Ergebnis.
  #
  # OFFEN: Der Distanzwert selbst braucht eine External Component
  # (esphome hat nur vl53l0x nativ). Erst damit lassen sich die zwei
  # Funktionen trennen - unter 0,6 m Display wecken, Baseline minus 15 cm
  # Durchstieg melden. Siehe docs/09.
  - platform: gpio
    name: Praesenz
    id: bewegung
    device_class: occupancy
    pin:
      pcf8574: expander
      number: 4
      mode:
        input: true
    on_press:
      then:
        - light.turn_on:
            id: backlight
            brightness: 80%
    on_release:
      then:
        - delay: 120s
        - if:
            condition:
              binary_sensor.is_off: bewegung
            then:
              - light.turn_off: backlight

  # Hardware-Ueberstromabschaltung, latched. Nur lesbar - der Schutz wirkt
  # in Hardware, diese Entitaeten melden ihn lediglich nach Home Assistant.
  - platform: gpio
    name: Hard-Trip Motor 1
    device_class: problem
    pin: {pcf8574: expander, number: 0, mode: {input: true}}
  - platform: gpio
    name: Hard-Trip Motor 2
    device_class: problem
    pin: {pcf8574: expander, number: 1, mode: {input: true}}

  # Fensterkontakte. Reed schliesst gegen Masse, der externe 10k-Pullup zieht
  # den Eingang sonst hoch - geschlossenes Fenster ist also LOW, deshalb
  # inverted. 300 ms Entprellung zusaetzlich zum RC-Glied auf dem Board.
  - platform: gpio
    name: Fenster 1
    id: fenster1
    device_class: window
    pin: {pcf8574: expander, number: 6, mode: {input: true}, inverted: true}
    filters: [delayed_on_off: 300ms]
  - platform: gpio
    name: Fenster 2
    id: fenster2
    device_class: window
    pin: {pcf8574: expander, number: 7, mode: {input: true}, inverted: true}
    filters: [delayed_on_off: 300ms]

# -----------------------------------------------------------------------------
# Jalousien
# -----------------------------------------------------------------------------
# Zeitgesteuert. Jede Fahrt endet spaetestens nach ${travel_time}.
# Richtungswechsel immer ueber Stop mit ${reversal_pause} Pause.

cover:
  - platform: time_based
    name: Jalousie 1
    id: jalousie1
    device_class: shutter
    open_action:
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}
      - delay: ${reversal_pause}
      - output.set_level: {id: m1_ina, level: 100%}
    close_action:
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}
      - delay: ${reversal_pause}
      - output.set_level: {id: m1_inb, level: 100%}
    stop_action:
      - output.set_level: {id: m1_ina, level: 0%}
      - output.set_level: {id: m1_inb, level: 0%}
    open_duration: ${travel_time}
    close_duration: ${travel_time}

  - platform: time_based
    name: Jalousie 2
    id: jalousie2
    device_class: shutter
    open_action:
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}
      - delay: ${reversal_pause}
      - output.set_level: {id: m2_ina, level: 100%}
    close_action:
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}
      - delay: ${reversal_pause}
      - output.set_level: {id: m2_inb, level: 100%}
    stop_action:
      - output.set_level: {id: m2_ina, level: 0%}
      - output.set_level: {id: m2_inb, level: 0%}
    open_duration: ${travel_time}
    close_duration: ${travel_time}

button:
  - platform: template
    name: Hard-Trip zuruecksetzen
    entity_category: config
    on_press:
      - switch.turn_on: trip_reset
      - delay: 50ms
      - switch.turn_off: trip_reset

  - platform: template
    name: Alarmton testen
    entity_category: diagnostic
    on_press:
      - rtttl.play: "alarm:d=4,o=5,b=140:8b,8p,8b,8p,8b"
